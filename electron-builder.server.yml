# BugShot 服务端安装包：和客户端同一份代码，入口换成 out/main/server-app.js
appId: com.hui455.bugshot.server
productName: BugShot Server
extraMetadata:
  main: out/main/server-app.js
  name: bugshot-server
directories:
  output: release-server
  buildResources: build
files:
  - out/**/*
  - package.json
win:
  target: nsis
  artifactName: BugShot-Server-Setup-${version}.${ext}
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
mac:
  target:
    - target: dmg
      arch: [x64, arm64]
    # 自动更新用 zip
    - target: zip
      arch: [x64, arm64]
  category: public.app-category.developer-tools
  artifactName: BugShot-Server-${version}-${arch}.${ext}
linux:
  target: AppImage
  artifactName: BugShot-Server-${version}.${ext}
# 自动更新：和客户端放在同一个 Release，但用自己的通道文件 server.yml / server-mac.yml，
# 不会覆盖客户端的 latest.yml。由发布流程单独上传到 Release
publish:
  provider: github
  owner: hui455
  repo: test-android
  releaseType: release
  channel: server
# 更新说明和客户端用同一份（发版前由 npm run release-notes 生成）
releaseInfo:
  releaseNotesFile: out/release-notes.md
