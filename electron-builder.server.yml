# BugShot 服务端安装包：和客户端同一份代码，入口换成 out/main/server-app.js
appId: com.hui455.bugshot.server
productName: BugShot Server
extraMetadata:
  main: out/main/server-app.js
  name: bugshot-server
directories:
  output: release-server
  buildResources: build
files:
  - out/**/*
  - package.json
win:
  target: nsis
  artifactName: BugShot-Server-Setup-${version}.${ext}
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
mac:
  target:
    - target: dmg
      arch: [x64, arm64]
  category: public.app-category.developer-tools
  artifactName: BugShot-Server-${version}-${arch}.${ext}
linux:
  target: AppImage
  artifactName: BugShot-Server-${version}.${ext}
# 不走自动更新（会和客户端的 latest.yml 冲突），由发布流程单独上传到 Release
publish: null
