name: Release

# 推送 v* 标签（如 v0.3.0），或在 Actions 页面手动运行时，打包 Windows / macOS 安装包
# 并发布到 GitHub Releases（标签按 package.json 的版本号自动创建）。
# 已安装的 BugShot 会通过“检查更新”拿到新版本。
# 同一个 Release 里还会放 BugShot 服务端的安装包，并把不带窗口的服务端推到 ghcr.io（Docker / NAS 用）。
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run fetch-adb
      - run: npm run build
      # 从 CHANGELOG.md 取这一版的“新增 / 修复”，没写会在这里失败
      - run: npm run release-notes
      - run: npx electron-builder --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: false
      # 服务端安装包不走自动更新，单独上传，免得覆盖客户端的 latest.yml
      - run: npx electron-builder --config electron-builder.server.yml --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
      - name: 上传服务端安装包、写更新说明
        shell: bash
        run: |
          v="v$(node -p "require('./package.json').version")"
          gh release upload "$v" release-server/BugShot-Server-* --clobber
          gh release edit "$v" --notes-file out/release-notes.md
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build:server
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: 构建并推送镜像
        run: |
          v=$(node -p "require('./package.json').version")
          img=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/bugshot-server
          docker build -t $img:$v -t $img:latest .
          docker push $img:$v
          docker push $img:latest
