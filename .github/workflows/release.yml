name: Release（客户端）

# 推送 v* 标签（如 v0.8.0），或在 Actions 页面手动运行时，打包客户端 Windows / macOS 安装包
# 并发布到 GitHub Releases（标签按 package.json 的 version 自动创建），这个 Release 是“最新版本”。
# 已安装的 BugShot 会通过“检查更新”拿到新版本。
# 服务端单独发版，见 release-server.yml（server-v* 标签）。
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: 标签和 package.json 的 version 要一致
        if: github.ref_type == 'tag'
        shell: bash
        run: |
          v="v$(node -p "require('./package.json').version")"
          [ "$GITHUB_REF_NAME" = "$v" ] || { echo "标签 $GITHUB_REF_NAME 和 package.json 的 version（$v）不一致"; exit 1; }
      - run: npm ci
      - run: npm test
      - run: npm run fetch-adb
      - run: npm run build
      # 从 CHANGELOG.md 取这一版的“新增 / 修复”，没写会在这里失败
      - run: npm run release-notes
      - run: npx electron-builder --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: false
      - name: 写更新说明
        shell: bash
        run: gh release edit "v$(node -p "require('./package.json').version")" --notes-file out/release-notes.md
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
